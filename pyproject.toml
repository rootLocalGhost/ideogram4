[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ideogram-4"
version = "0.1.0"
description = "Inference code for the Ideogram 4 text-to-image model."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Ideogram" }]
keywords = ["text-to-image", "diffusion", "flow-matching", "ideogram"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Removed torch, torchvision, and accelerate to prevent PyPI overwriting your XPU wheels.
dependencies = [
  "transformers",
  "safetensors",
  "einops",
  "sentencepiece",
  "pillow",
  "accelerate",
  "huggingface_hub",
  "requests",
  "bitsandbytes",
]

[tool.mypy]
[[tool.mypy.overrides]]
module = ["transformers.*", "huggingface_hub.*", "bitsandbytes.*", "requests.*"]
ignore_missing_imports = true

[tool.ruff]
indent-width = 2
extend-exclude = ["tmp"]

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.hatch.build.targets.wheel]
packages = ["src/ideogram4"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ideogram4",
  "src/ideogram4/magic_prompt_system_prompts/*.txt",
  "run_inference_xpu.py",
  "README.md",
  "pyproject.toml",
]